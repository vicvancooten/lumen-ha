name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: theme

  generator:
    name: Generator dry-run check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r dashboard/requirements.txt
      - run: python -m py_compile dashboard/build_dashboard.py dashboard/halloween.py
      - run: python -c "import yaml; yaml.safe_load(open('dashboard/house.example.yaml')); yaml.safe_load(open('themes/lumen.yaml'))"
