# BirdNET-Go for Home Assistant: sensors for the Lumen home page.
#
# BirdNET-Go's API is open on the LAN, so plain REST sensors are enough: no MQTT broker needed.
# Install: save this as /config/packages/birdnet_go.yaml and make sure configuration.yaml has
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# (or paste the two top-level blocks below into configuration.yaml), then restart Home Assistant.
# The host below is the BirdNET-Go add-on's hostname as Home Assistant sees it (the hash is the add-on
# repository's, shown in the add-on's URL). If BirdNET-Go runs elsewhere, replace it with that machine's
# address and port, e.g. http://192.168.1.20:8080 (find and replace all occurrences).
#
# Entities created:
#   sensor.birdnet_go_last_bird          state = species; attributes confidence, timestamp, scientificName, ...
#   image.birdnet_go_last_bird_photo     photo of that species, proxied through HA (works over https)
#   sensor.birdnet_go_species_today      distinct species heard today
#   sensor.birdnet_go_detections_today   detections today
#   sensor.birdnet_go_top_bird_today     most-heard species today
#   sensor.birdnet_go_top_species_today  the top six as "Name~count;Name~count" (for the species bars)
#   sensor.birdnet_go_recent_detections  state = total; attribute `data` = the latest eight detections

rest:
  - resource: http://db21ed7f-birdnet-go:8080/api/v2/detections/recent?limit=1
    scan_interval: 60
    sensor:
      - name: BirdNET-Go last bird
        unique_id: birdnet_go_last_bird
        icon: mdi:bird
        value_template: "{{ value_json[0].commonName if value_json | length else 'none' }}"
        json_attributes_path: "$[0]"
        json_attributes: [scientificName, confidence, timestamp, isNewSpecies, isNewThisYear]

  - resource: http://db21ed7f-birdnet-go:8080/api/v2/analytics/species/daily
    scan_interval: 120
    sensor:
      - name: BirdNET-Go species today
        unique_id: birdnet_go_species_today
        icon: mdi:feather
        state_class: measurement
        unit_of_measurement: species
        value_template: "{{ value_json | length }}"
      - name: BirdNET-Go detections today
        unique_id: birdnet_go_detections_today
        icon: mdi:microphone
        state_class: measurement
        unit_of_measurement: detections
        value_template: "{{ value_json | sum(attribute='count') }}"
      - name: BirdNET-Go top bird today
        unique_id: birdnet_go_top_bird_today
        icon: mdi:trophy-outline
        value_template: >-
          {% set top = value_json | sort(attribute='count', reverse=true) | first | default(none) %}
          {{ top.common_name if top else 'none' }}
      - name: BirdNET-Go top species today
        unique_id: birdnet_go_top_species_today
        icon: mdi:podium
        value_template: >-
          {%- set top = value_json | sort(attribute='count', reverse=true) | list -%}
          {%- if top -%}{%- for s in top[:6] -%}{{ s.common_name }}~{{ s.count }}{{ ';' if not loop.last }}{%- endfor -%}{%- else -%}none{%- endif -%}

  - resource: http://db21ed7f-birdnet-go:8080/api/v2/detections?numResults=8
    scan_interval: 60
    sensor:
      - name: BirdNET-Go recent detections
        unique_id: birdnet_go_recent_detections
        icon: mdi:history
        value_template: "{{ value_json.total }}"
        json_attributes: [data]

template:
  - image:
      - name: BirdNET-Go last bird photo
        unique_id: birdnet_go_last_bird_photo
        url: >-
          http://db21ed7f-birdnet-go:8080/api/v2/media/image/{{ state_attr('sensor.birdnet_go_last_bird', 'scientificName') | urlencode }}
        availability: "{{ state_attr('sensor.birdnet_go_last_bird', 'scientificName') is string }}"
