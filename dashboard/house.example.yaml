# Lumen dashboard — example house config.
# Copy to house.yaml, replace the entity IDs with your own, then run:
#   python3 build_dashboard.py house.yaml
#
# Keys under `rooms` are Home Assistant area IDs (Settings → Areas → the ID in the URL).
# The area's picture becomes the room photo. Anything marked optional can be left out.
# Entity lists accept plain IDs or objects: {entity: light.x, name: ..., icon: ..., color: ...}

home_assistant:
  url: http://homeassistant.local:8123
  token_file: ~/.config/lumen/ha-token    # or set the HA_TOKEN environment variable

dashboard:
  url_path: home-dashboard   # must contain a hyphen; created if it doesn't exist yet
  title: Home
  kiosk: true                # hide HA's header + sidebar (needs kiosk-mode)

user_name: Alex              # optional: "Good evening, Alex"
weather: weather.forecast_home

people:                      # optional: presence chips on the home page
  - {entity: person.alex, name: Alex, icon: mdi:account}
  - {entity: person.sam, name: Sam, icon: mdi:account-heart}

power: {entity: sensor.power_consumption, unit: kW}   # optional live power chip (unit: W or kW)

waste:                       # optional bin-collection chip (e.g. the Afvalwijzer integration)
  next_type: sensor.waste_next_type
  days_until: sensor.waste_next_in_days
  next_date: sensor.waste_next_date

quick_settings:              # 3×3 grid of tiles on the home page
  - {entity: light.all_lights, name: All lights, icon: mdi:lightbulb-group, color: amber}
  - {entity: scene.evening, name: Evening, icon: mdi:weather-night, color: deep-purple, action: scene}
  - {entity: alarm_control_panel.home, name: Alarm, icon: mdi:shield-home, color: red}
  - {entity: light.porch, name: Entrance, icon: mdi:door-open, color: amber}
  - {entity: light.garden, name: Garden, icon: mdi:pine-tree, color: amber}
  - {entity: light.terrace, name: Terrace, icon: mdi:string-lights, color: amber}
  - {entity: vacuum.robot, name: Vacuum, icon: mdi:robot-vacuum, color: teal,
     action: {action: navigate, navigation_path: /home-dashboard/vacuum}}   # any tap action works
  # - {entity: script.good_night, name: Good night, icon: mdi:power-sleep, color: indigo, action: script,
  #    confirm: "Turn everything off?"}                                     # runs a script, optionally asks first
  - {entity: media_player.living_room_speakers, name: Music, icon: mdi:music-circle-outline, color: pink,
     action: {action: navigate, navigation_path: /home-dashboard/media}}
  - {entity: todo.shopping_list, name: Groceries, icon: mdi:cart-outline, color: cyan, action: todo}

# night_mode: input_boolean.night_mode   # optional: the greeting says when it's on
# alarm_mode: input_boolean.alarm_mode   # optional: a shield chip on the home page toggles it
#                                        # (asks first); red and in the greeting while it's on

energy:                      # optional; the heading and power graph open the Energy dashboard
  dashboard: /energy
  graph: sensor.power_consumption        # power sensor: today's curve, and electricity per hour from its mean
  power_unit: kW                         # W or kW
  gas: sensor.gas_consumption            # optional: gas meter; with `graph`, an hour-by-hour chart (apexcharts-card)
  gas_flow: sensor.gas_flow_rate         # optional: a Derivative helper of the gas meter, in m³/h
  baseload: sensor.electricity_baseload  # optional: a Statistics helper, the 24 h minimum of `graph`
  today: {electricity: sensor.electricity_today, gas: sensor.gas_today}   # optional: daily Utility Meter
                                         # helpers; today's totals sit large above the hour-by-hour chart
  insight:                               # optional: an AI-written story of the day, and an Energy page
    headline: input_text.energy_insight_headline   # written by a script of your own (e.g. ai_task.generate_data)
    rating: input_text.energy_insight_rating       # optional: good / usual / high; sets the icon and colour
    verdict: input_text.energy_insight_verdict     # optional: good or not, and why (vs. your own average)
    gas: input_text.energy_insight_gas
    power: input_text.energy_insight_power
    waste: input_text.energy_insight_waste         # optional: where energy was wasted
    tip: input_text.energy_insight_tip
    refresh: script.energy_insight_refresh         # "Rewrite story" button
  devices:                               # optional: measured consumers on the Energy page
    - {entity: sensor.fridge_power, name: Fridge, icon: mdi:fridge-outline}
  badges:
    - {entity: sensor.electricity_tariff, icon: mdi:clock-outline}
    - {entity: sensor.co2_intensity, icon: mdi:leaf, color: green}

media:                       # optional: "Now playing" on the home page while something's on (what's playing,
                             # volume, a remote pad), a Media page with the full remote and the music, and
                             # the same on the room's page. Music via Music Assistant and the
                             # yet-another-media-player card (HACS).
  room: living_room          # the room page that gets the player and remote
  tvs:                       # one or more TVs; each shows on the home page while it's on
  - name: Living room TV
    entity: media_player.living_room_tv       # what's playing: title, artwork, play/pause (e.g. Google Cast)
    power: media_player.living_room_tv_remote # optional: power button (e.g. Android TV Remote)
    remote: remote.living_room_tv             # optional: remote pad, app shortcuts
    # remote_keys: {up: CursorUp, select: Confirm}   # optional: key names, if not Android TV Remote's (DPAD_UP...)
    # preview: camera.living_room_tv_screen         # optional: the TV's screen behind the player, e.g. ADB
    # preview_frame: counter.living_room_tv_frame   #   screenshots into a Local File camera, and a counter that
    #                                               #   ticks with each new one (see ../ha/tv_preview.yaml)
    volume: media_player.soundbar             # optional: when the TV's sound goes through other speakers
    live_tv: {entity: media_player.tv, source: Watch TV}   # optional: a Live TV shortcut
    apps:                                     # optional: app shortcuts (remote.turn_on activity)
      - {name: YouTube, icon: mdi:youtube, activity: https://www.youtube.com}
  # - name: Bedroom TV
  #   room: bedroom          # the room page that gets this TV (the first TV defaults to `room` above)
  #   entity: media_player.bedroom_tv
  #   power: media_player.bedroom_tv_remote
  #   remote: remote.bedroom_tv
  players:                   # music players (Music Assistant entities: search, favourites, radio)
    - {entity: media_player.living_room_speakers, name: Living room}
    - {entity: media_player.bedroom_speakers, name: Bedroom}   # tv: Bedroom TV  hides it while that TV is on (TV sound)

birdnet:                     # optional: BirdNET-Go on the home page + a Birds page (sensors: ../ha/birdnet_go.yaml)
  title: Outside             # heading of the home-page block
  last_bird: sensor.birdnet_go_last_bird
  photo: image.birdnet_go_last_bird_photo
  species_today: sensor.birdnet_go_species_today
  detections_today: sensor.birdnet_go_detections_today
  top_bird: sensor.birdnet_go_top_bird_today
  top_species: sensor.birdnet_go_top_species_today   # optional: species bars on the Birds page
  recent: sensor.birdnet_go_recent_detections        # optional: latest detections on the Birds page
  camera: camera.garden                              # optional: live camera with the last bird laid over it
  camera_name: Garden
  camera_detect: [binary_sensor.garden_person]       # optional: green ring around the camera while these are on
  camera_page: /home-dashboard/cameras               # optional: where the block's heading goes
  door_camera:                                       # optional: a second camera beside it
    live: camera.front_door                          # shown live...
    idle: camera.front_door_last_visitor             # ...or this snapshot while `wired` is off and `timer` idle
    wired: input_boolean.doorbell_wired              # optional
    timer: timer.front_door_activity                 # optional
    activity: automation.front_door_activity         # optional: its last run is shown as "2 h ago · Tap for live"
    asleep: binary_sensor.front_door_sleep_status    # optional: battery camera's sleep sensor; live while it's awake
    detect: [binary_sensor.front_door_person]        # optional: green ring while these are on
    name: Front door
  saezuri_app: 22d5d804_saezuri                      # optional: embed the Saezuri collage on the Birds page
  birdnet_app: db21ed7f_birdnet-go                   # optional: "Open BirdNET-Go" button (the app's slug)
  room: garden                                       # optional: add bird detail to this room's page
  extra_tiles:                                       # optional: more tiles under the cameras
    - {entity: light.garden, name: Garden light, color: amber}

# overlay: overlay.json      # optional: hand-made views and sections merged into the generated dashboard
#   (JSON: {"views": [<whole view, no header section>], "sections": [{"view": "garden", "index": 1, "section": {...}}]}
#    `index` counts from the first section under the header. A view with an existing path replaces it.)

# haunted:                   # optional: now and then, hair creeps out of a corner of a room photo
#   every: 100               # average seconds between appearances, per room (randomised 50-150%)
#   duration: 1              # seconds it stays visible
#   api_key_file: ~/.config/lumen/openai-key   # or set OPENAI_API_KEY
#   model: gpt-image-2       # any OpenAI-compatible image model; api_url: to use another endpoint
#   quality: high            # low / medium / high: cheaper vs. more convincing
#   rooms: [bedroom, bathroom]                 # default: every room
#   prompt: "..."            # replaces the built-in prompt; {name} is the room name

floors:                      # `id` is the HA floor ID
  - {id: ground_floor, path: ground-floor, name: Ground floor, short: Ground, icon: mdi:home-floor-g, tagline: "Living, cooking & outdoors"}
  - {id: first_floor, path: first-floor, name: First floor, short: First, icon: mdi:home-floor-1, tagline: "Sleeping & working"}
  # - {id: attic, path: attic, name: Attic, icon: mdi:home-roof, nav: false}   # nav: false → in the More menu

# nav_tabs:                  # optional: extra navbar tabs after the floors
#   - {path: cameras, label: Outside, icon: mdi:flower-tulip-outline, also: [birds]}   # `also`: pages that light it up

rooms:
  living_room:
    floor: ground_floor
    name: Living room
    lights: [light.living_room_ceiling, light.living_room_floor_lamp]
    scenes:                  # a row of scene buttons on the room page; the last one used glows
      - {entity: scene.living_room_bright, name: Bright, icon: mdi:white-balance-sunny, color: amber}
      - {entity: scene.evening, name: Evening, icon: mdi:weather-sunset, color: pink}
    media: [media_player.living_room_tv, media_player.living_room_speaker]
    vacuum:                  # optional robot-vacuum panel
      entity: vacuum.robot
      name: Vacuum
      battery: sensor.robot_battery
      current_room: sensor.robot_current_room
      last_clean: sensor.robot_last_clean_end
      brush: sensor.robot_main_brush_time_left
      filter: sensor.robot_filter_time_left
      quiet_hours: switch.robot_do_not_disturb
      # With `selection`, the vacuum gets its own page (Roborock): live map, controls, fan speed, and rooms per map
      # (from roborock.get_maps) to pick and clean. The helpers and scripts are yours to create:
      # selection: input_text.vacuum_rooms           # comma-separated segment ids
      # passes: input_number.vacuum_passes
      # toggle_script: script.vacuum_toggle_room     # field `segment`
      # clean_room_script: script.vacuum_clean_room  # field `segment`
      # clean_script: script.vacuum_clean_rooms      # cleans the selection (vacuum.send_command app_segment_clean)
      # clear_script: script.vacuum_clear_rooms
      # map_select: select.robot_selected_map
      # cleaning_mode: select.robot_cleaning_mode
      # mop_intensity: select.robot_mop_intensity
      # side_brush / sensors / area / clean_time / total_count / total_area / error / volume: more sensors
    motion: [binary_sensor.living_room_occupancy]
    graphs:
      - {entity: sensor.living_room_temperature, name: Temperature, color: "#ff9f43"}
      - {entity: sensor.living_room_humidity, name: Humidity, color: "#54a0ff"}
    batteries: [sensor.living_room_remote_battery]
    automations: [automation.living_room_motion_lights]

  kitchen:
    floor: ground_floor
    name: Kitchen
    lights: [light.kitchen]
    fridge:                  # optional smart-fridge panel
      fridge_temp: sensor.fridge_temperature
      freezer_temp: sensor.freezer_temperature
      doors:
        - {entity: binary_sensor.fridge_door, name: Fridge door}
        - {entity: binary_sensor.freezer_door, name: Freezer door}
      switches:
        - {entity: switch.fridge_power_cool, name: Power cool, icon: mdi:snowflake-alert}
        - {entity: switch.fridge_power_freeze, name: Power freeze, icon: mdi:snowflake-melt, color: blue}
      filter: sensor.fridge_water_filter_usage
      power: sensor.fridge_power
      energy: sensor.fridge_energy

  garden:
    floor: ground_floor
    name: Garden
    lights: [light.garden]
    camera: camera.garden
    power: [sensor.garden_plug_power, sensor.garden_plug_energy]   # graph + total
    automations: [automation.garden_lights_at_sunset]

  bedroom:
    floor: first_floor
    name: Bedroom
    lights: [light.bedroom]
    media: [media_player.bedroom_tv, media_player.bedroom_speaker]
    sound_switches:          # optional speaker toggles (e.g. Sonos)
      - {entity: switch.bedroom_speaker_night_sound, name: Night sound}
      - {entity: switch.bedroom_speaker_speech_enhancement, name: Speech enhancement}
    graphs:
      - {entity: sensor.bedroom_temperature, name: Temperature, color: "#ff9f43"}
    next_alarm: sensor.phone_next_alarm
    batteries: [sensor.bedroom_sensor_battery]

  office:
    floor: first_floor
    name: Office
    lights: [light.office_desk]
    motion: [binary_sensor.office_presence]
    contacts: [binary_sensor.office_window]

  bathroom:
    floor: first_floor
    name: Bathroom
    lights: [light.bathroom]
    motion: [binary_sensor.bathroom_motion]
